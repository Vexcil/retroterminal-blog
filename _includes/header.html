<header class="site-header">
  <h1><a class="site-brand" href="{{ "/" | relative_url }}">RetroTerminal<span class="blink" aria-hidden="true"></span></a></h1>
  <nav aria-label="Primary navigation">
    <ul class="nav-links">
      <li><a href="https://synth.retroterminal.net">Synth</a></li>
      {% if site.posts.size > 0 %}
        <li><a href="{{ "/posts/" | relative_url }}">Posts</a></li>
      {% endif %}
      <li><a href="{{ "/recipes/" | relative_url }}"{% if page.url == "/recipes/" or page.url == "/recipes.html" %} aria-current="page"{% endif %}>Recipes</a></li>
      <li><a href="{{ "/plant-control/" | relative_url }}"{% if page.url == "/plant-control/" %} aria-current="page"{% endif %}>Plants</a></li>
      <li><a href="{{ site.tabs_nav_url | default: "/tabs/" }}"{% if page.lightweight %} aria-current="page"{% endif %}>Tabs</a></li>
      <li><a href="https://matomo.retroterminal.net" target="_blank" rel="noopener">Matomo</a></li>
      <li><a href="{{ "/about/" | relative_url }}"{% if page.url == "/about/" or page.url == "/about.html" %} aria-current="page"{% endif %}>About</a></li>
    </ul>
  </nav>
</header>
