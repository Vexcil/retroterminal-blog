<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} - {{ site.title }}</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/style.css" | relative_url }}">

  <link rel="icon" href="{{ "/assets/RetroTerminalFavicon.ico" | relative_url }}" type="image/x-icon">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "url": "https://retroterminal.net",
    "logo": "https://retroterminal.net/assets/RetroTerminalLogo.png"
  }
  </script>

  {% if page.noindex %}
    <meta name="robots" content="noindex, nofollow">
  {% endif %}
</head>

<body class="theme-green">
  <div id="screen" class="crt crt-colorsep">
    {% include header.html %}
    <main class="main-content">
      <article class="post">
        <h1 class="post-title">{{ page.title }}</h1>
        {{ content }}
      </article>
    </main>
    {% include footer.html %}
  </div>
  <div class="theme-switcher" id="themeSwitcher">
    <div class="theme-menu-core">
      <div class="theme-dot" id="themeToggle">&gt;_</div>
    </div>
    <div class="theme-options" id="themeOptions">
      <div class="theme-dot small" data-theme="theme-green" style="background:#000; box-shadow: inset 0 0 0 2px #0f0;"></div>
      <div class="theme-dot small" data-theme="theme-blackred" style="background:#000; box-shadow: inset 0 0 0 2px #ff3b3b;"></div>
      <div class="theme-dot small" data-theme="theme-blackorange" style="background:#000; box-shadow: inset 0 0 0 2px #ff9f1a;"></div>
      <div class="theme-dot small" data-theme="theme-blackblue" style="background:#000; box-shadow: inset 0 0 0 2px #4169e1;"></div>
      <div class="theme-dot small" data-theme="theme-blackpurple" style="background:#000; box-shadow: inset 0 0 0 2px #c07cff;"></div>
      <div class="theme-dot small" data-theme="theme-unix" style="background:#002a7f; box-shadow: inset 0 0 0 2px #fff;"></div>
      <div class="theme-dot small" data-theme="theme-tan" style="background:#f4e7cf; box-shadow: inset 0 0 0 2px #4b2f1f;"></div>
      <div class="theme-dot small" data-theme="theme-bluewhite" style="background:#f5f7ff; box-shadow: inset 0 0 0 2px #0a2a6b;"></div>
      <div class="theme-dot small" data-theme="theme-amberpaper" style="background:#fff7df; box-shadow: inset 0 0 0 2px #7a4b00;"></div>
      <div class="theme-dot small" data-theme="theme-forestpaper" style="background:#f3f8f1; box-shadow: inset 0 0 0 2px #2f6d3b;"></div>
      <div class="theme-dot small" data-theme="theme-rosepaper" style="background:#fff4f6; box-shadow: inset 0 0 0 2px #8a3453;"></div>
      <div class="theme-dot small" data-theme="theme-slatepaper" style="background:#f3f5f7; box-shadow: inset 0 0 0 2px #324b63;"></div>
      <div class="theme-dot small" data-theme="theme-mintnight" style="background:#041914; box-shadow: inset 0 0 0 2px #4bdba8;"></div>
      <div class="theme-dot small" data-theme="theme-goldnight" style="background:#120d02; box-shadow: inset 0 0 0 2px #dba931;"></div>
      <div class="theme-dot small" data-theme="theme-iceblue" style="background:#eef8ff; box-shadow: inset 0 0 0 2px #1f5d87;"></div>
      <div class="theme-dot small" data-theme="theme-terminalsunset" style="background:#13000d; box-shadow: inset 0 0 0 2px #ff4fa3;"></div>
      <div class="theme-dot small" data-theme="theme-oceanink" style="background:#041b2d; box-shadow: inset 0 0 0 2px #56a7d9;"></div>
      <div class="theme-dot small" data-theme="theme-lavendercream" style="background:#fbf7ff; box-shadow: inset 0 0 0 2px #6a4da3;"></div>
      <div class="theme-dot small" data-theme="theme-toxic" style="background:#090f00; box-shadow: inset 0 0 0 2px #b8e800;"></div>
      <div class="theme-dot small" data-theme="theme-cyberaqua" style="background:#001417; box-shadow: inset 0 0 0 2px #28d8d0;"></div>
      <div class="theme-dot small" data-theme="theme-deepsepia" style="background:#17110b; box-shadow: inset 0 0 0 2px #b88a57;"></div>
      <div class="theme-dot small" data-theme="theme-mulberrynight" style="background:#140915; box-shadow: inset 0 0 0 2px #b96cae;"></div>
      <div class="theme-dot small" data-theme="theme-emeraldink" style="background:#081611; box-shadow: inset 0 0 0 2px #4fb88a;"></div>
      <div class="theme-dot small" data-theme="theme-coppernight" style="background:#18100b; box-shadow: inset 0 0 0 2px #b9773c;"></div>
      <div class="theme-dot small" data-theme="theme-stormblue" style="background:#0c1622; box-shadow: inset 0 0 0 2px #5f88c9;"></div>
      <div class="theme-dot small" data-theme="theme-graphite" style="background:#181a1f; box-shadow: inset 0 0 0 2px #727f95;"></div>
      <div class="theme-dot small" data-theme="theme-plumink" style="background:#160d1b; box-shadow: inset 0 0 0 2px #8e69d1;"></div>
      <div class="theme-dot small" data-theme="theme-coalember" style="background:#19110f; box-shadow: inset 0 0 0 2px #c46649;"></div>
      <div class="theme-dot small" data-theme="theme-arcticnight" style="background:#07131c; box-shadow: inset 0 0 0 2px #5ea6c7;"></div>
      <div class="theme-dot small" data-theme="theme-mosscharcoal" style="background:#12150f; box-shadow: inset 0 0 0 2px #839c54;"></div>
      <div class="theme-dot small" data-theme="theme-duskteal" style="background:#0a1718; box-shadow: inset 0 0 0 2px #489d95;"></div>
      <div class="theme-dot small" data-theme="theme-crimsonvelvet" style="background:#17080d; box-shadow: inset 0 0 0 2px #c34c69;"></div>
      <div class="theme-dot small" data-theme="theme-violetfog" style="background:#11101b; box-shadow: inset 0 0 0 2px #766ec9;"></div>
      <div class="theme-dot small" data-theme="theme-sandnight" style="background:#19150d; box-shadow: inset 0 0 0 2px #a4884e;"></div>
      <div class="theme-dot small" data-theme="theme-midnightjade" style="background:#061311; box-shadow: inset 0 0 0 2px #469876;"></div>
      <div class="theme-dot small" data-theme="theme-nebula" style="background:#0f1020; box-shadow: inset 0 0 0 2px #8f67c4;"></div>
      <div class="theme-dot small" data-theme="theme-obsidiangold" style="background:#0f0d08; box-shadow: inset 0 0 0 2px #b38b2f;"></div>
      <div class="theme-dot small" data-theme="theme-inkrose" style="background:#150f14; box-shadow: inset 0 0 0 2px #b86188;"></div>
      <div class="theme-dot small" data-theme="theme-sapphiremist" style="background:#0c1220; box-shadow: inset 0 0 0 2px #6078c0;"></div>
      <div class="theme-dot small" data-theme="theme-pineglow" style="background:#09110c; box-shadow: inset 0 0 0 2px #4f9c60;"></div>
    </div>
  </div>
  <div class="floating-reader-controls">
    <div class="theme-dot small theme-effect-toggle active" id="glowlineToggle" title="Toggle scan bar">FX</div>
  </div>
  <script>
    (function () {
      const themes = [
        "theme-green",
        "theme-blackred",
        "theme-blackorange",
        "theme-blackblue",
        "theme-blackpurple",
        "theme-unix",
        "theme-tan",
        "theme-bluewhite",
        "theme-amberpaper",
        "theme-forestpaper",
        "theme-rosepaper",
        "theme-slatepaper",
        "theme-mintnight",
        "theme-goldnight",
        "theme-iceblue",
        "theme-terminalsunset",
        "theme-oceanink",
        "theme-lavendercream",
        "theme-toxic",
        "theme-cyberaqua",
        "theme-deepsepia",
        "theme-mulberrynight",
        "theme-emeraldink",
        "theme-coppernight",
        "theme-stormblue",
        "theme-graphite",
        "theme-plumink",
        "theme-coalember",
        "theme-arcticnight",
        "theme-mosscharcoal",
        "theme-duskteal",
        "theme-crimsonvelvet",
        "theme-violetfog",
        "theme-sandnight",
        "theme-midnightjade",
        "theme-nebula",
        "theme-obsidiangold",
        "theme-inkrose",
        "theme-sapphiremist",
        "theme-pineglow"
      ];
      const body = document.body;
      const switcher = document.getElementById("themeSwitcher");
      const toggle = document.getElementById("themeToggle");
      const options = document.getElementById("themeOptions");
      const glowlineToggle = document.getElementById("glowlineToggle");

      function setTheme(themeName) {
        themes.forEach(name => body.classList.remove(name));
        body.classList.add(themeName);
        localStorage.setItem("retroterminal_theme", themeName);
      }

      function setGlowlineEnabled(enabled) {
        body.classList.toggle("glowline-off", !enabled);
        glowlineToggle.classList.toggle("active", enabled);
        localStorage.setItem("retroterminal_glowline_enabled", enabled ? "1" : "0");
      }

      const saved = localStorage.getItem("retroterminal_theme");
      if (saved && themes.includes(saved)) {
        setTheme(saved);
      }
      setGlowlineEnabled(localStorage.getItem("retroterminal_glowline_enabled") !== "0");

      toggle.addEventListener("click", () => {
        switcher.classList.toggle("open");
      });

      options.querySelectorAll("[data-theme]").forEach(el => {
        el.addEventListener("click", () => {
          setTheme(el.getAttribute("data-theme"));
        });
      });

      glowlineToggle.addEventListener("click", () => {
        setGlowlineEnabled(body.classList.contains("glowline-off"));
      });

      let lastY = window.scrollY;
      window.addEventListener("scroll", () => {
        const y = window.scrollY;
        if (y > lastY + 10) {
          switcher.classList.add("hidden");
        } else if (y < lastY - 10) {
          switcher.classList.remove("hidden");
        }
        lastY = y;
      }, { passive: true });
    })();
  </script>
</body>
</html>
