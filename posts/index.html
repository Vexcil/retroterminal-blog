---
layout: default
title: Posts
---

<section class="services">
  {% if site.posts.size > 0 %}
  <h2>All Posts</h2>
  <ul>
    {% for p in site.posts %}
      <li>
        <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
        <span style="font-size:smaller;">({{ p.date | date: "%Y-%m-%d" }})</span>
      </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>Posts are temporarily hidden.</p>
  {% endif %}
</section>
